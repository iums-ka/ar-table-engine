[project]
name = "ar-table-engine"
version = "0.1.0"
requires-python = ">=3.12.10,<3.13"

dependencies = [
    "numpy>=1.26,<2",
    "opencv-python==4.11.0.86",
    "websockets",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "cmake>=3.20",
    "pybind11>=3.1.0",
    "pytest>=9.0",
    "ruff>=0.15.8",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
fix = false

[tool.ruff.lint]
extend-select = ["D", "I", "EM"]
ignore = ["D107"]
pydocstyle = { convention = "google" }